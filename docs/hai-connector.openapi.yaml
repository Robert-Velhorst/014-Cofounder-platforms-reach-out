openapi: 3.1.0
info:
  title: Cofounder Outreach HAI Connector
  version: 1.0.0
paths:
  /api/integrations/hai/feed:
    get:
      summary: Read owner-scoped workflow events in HAI Generic JSON Feed format
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            pattern: "^[0-9]+$"
      responses:
        "200":
          description: Feed page
        "401":
          description: Missing or invalid token
        "403":
          description: Configured owner missing, unverified or suspended; no feed items returned
        "429":
          description: Local source guard or shared authenticated source/owner/service admission exhausted; no items returned
          headers:
            Retry-After:
              description: Conservative seconds before retry (60 for shared admission)
              schema:
                type: integer
                minimum: 1
                maximum: 60
        "503":
          description: Connector disabled, local guard capacity busy, or shared admission/database unavailable; no items returned
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
