# Disposable, synthetic-only test environment. No published ports or persistent
# volumes; use a unique Compose project name when retaining an earlier run.
services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cofounder_test
      MYSQL_USER: cofounder
      MYSQL_PASSWORD: synthetic-integration-password
      MYSQL_ROOT_PASSWORD: synthetic-integration-root-password
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      # TCP excludes MySQL's temporary initialization-only socket server.
      test:
        [
          "CMD",
          "mysql",
          "--no-defaults",
          "--host=127.0.0.1",
          "--protocol=TCP",
          "--connect-timeout=2",
          "--user=cofounder",
          "--password=synthetic-integration-password",
          "cofounder_test",
          "--execute=SELECT 1",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 15s
    # Only loopback exists in this namespace. No bridge subnet is allocated.
    network_mode: none

  tests:
    build:
      context: .
      target: integration-test
    init: true
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: test
      APP_MODE: test
      DATABASE_URL: mysql://cofounder:synthetic-integration-password@127.0.0.1:3306/cofounder_test
      JWT_SECRET: synthetic-integration-session-secret-not-for-hosting
      REQUIRE_DATABASE_TESTS: "true"
      # Only for per-case synthetic migration databases; never a runtime secret.
      MIGRATION_TEST_ROOT_PASSWORD: synthetic-integration-root-password
      ENABLE_ACCOUNT_MAIL_WORKER: "false"
      ENABLE_PLATFORM_AUTOMATION: "false"
      ENABLE_UNSAFE_LEGACY_ROUTES: "false"
      OPENAI_API_KEY: ""
      RESEND_API_KEY: ""
      AUTH_EMAIL_FROM: ""
      AUTH_MAIL_ENCRYPTION_SECRET: ""
    # Share only the isolated database container's loopback connection.
    network_mode: service:database
