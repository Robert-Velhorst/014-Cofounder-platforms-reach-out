name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:26.10.0@sha256:f51c9c01c16b0eb5d81bb70ab7e7fcb3b96abc6a54114be3a94e8e569cae7815
        env:
          MYSQL_DATABASE: cofounder_test
          MYSQL_USER: cofounder
          MYSQL_PASSWORD: cofounder
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql --no-defaults --host=127.0.0.1 --protocol=TCP --connect-timeout=2 --user=cofounder --password=cofounder cofounder_test --execute='SELECT 1'"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    env:
      NODE_ENV: test
      APP_MODE: test
      DATABASE_URL: mysql://cofounder:cofounder@127.0.0.1:3306/cofounder_test
      JWT_SECRET: ci-session-secret-with-at-least-thirty-two-characters
      ENABLE_REGISTRATION: "true"
      MIGRATION_TEST_ROOT_PASSWORD: root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify actual Node and MySQL versions
        run: node scripts/stable-runtime.mjs --database
      - name: Check production and development dependency advisories
        run: pnpm audit --audit-level low
      - run: pnpm --dir apps/cofounder-discovery check
      - run: pnpm test:release-contract
      - run: pnpm test:stable-runtime
      - run: pnpm test:requirements
      - name: Check source-derived API surface and current audit snapshot
        run: pnpm test:api-audit
      - name: Check source-derived UI actions and current audit snapshot
        run: pnpm test:ui-audit
      - run: pnpm test:budget
      - run: pnpm test:recovery
      - run: pnpm test:monitor
      - run: pnpm test:production-config
      - run: pnpm test:hetzner-config
      - run: pnpm test:hetzner-database
      - run: pnpm test:support
      - run: pnpm test:release-inventory
      - run: pnpm --dir apps/cofounder-discovery test:unit
      - run: pnpm --dir apps/cofounder-discovery build
      - run: pnpm --dir apps/cofounder-discovery db:migrate
      - run: pnpm --dir apps/cofounder-discovery test:integration
      - run: pnpm test:readiness:integration
      - name: Build recovery rehearsal dependencies
        run: docker build --target integration-test --tag cofounder-recovery-test:local .
      - name: Build recovery rehearsal production runtime
        run: docker build --target runtime --tag cofounder-recovery-runtime:local .
      - name: Build the reviewed Hetzner TLS edge
        run: docker build --file Dockerfile.hetzner-edge --tag cofounder-hetzner-edge:local .
      - name: Build the privilege-separated Hetzner database
        run: docker build --file Dockerfile.hetzner-database --tag cofounder-hetzner-database:local .
      - name: Verify fresh database role and permission boundaries
        run: pnpm test:hetzner-database:integration
      - run: pnpm test:recovery:integration
      - run: pnpm test:runtime-startup:integration
      - run: pnpm test:authentication-admission:integration
      - name: Qualify the complete synthetic customer workload
        run: pnpm test:customer-load:integration
      - name: Verify actual HTTPS ingress and session boundaries
        run: pnpm test:tls-ingress:integration
      - run: pnpm audit --prod --audit-level low
      - name: Verify actual edge and database executable versions
        run: |
          mkdir -p output
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint caddy cofounder-hetzner-edge:local version > output/caddy-version.txt
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint mysqld cofounder-hetzner-database:local --version > output/mysql-version.txt
          grep -Eq '^v2[.]11[.]7-cofounder[.]20261023[.]2( |$)' output/caddy-version.txt
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint cat cofounder-hetzner-edge:local /usr/share/caddy/build-info.txt > output/caddy-build-info.txt
          grep -q 'go1.27.3' output/caddy-build-info.txt
          for item in linked-packages.txt build-environment.json binary-sha256.txt; do
            docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint cat cofounder-hetzner-edge:local "/usr/share/caddy/$item" > "output/caddy-$item"
          done
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint sha256sum cofounder-hetzner-edge:local /usr/bin/caddy > output/caddy-runtime-sha256.txt
          test "$(cut -d' ' -f1 output/caddy-binary-sha256.txt)" = "$(cut -d' ' -f1 output/caddy-runtime-sha256.txt)"
          grep -Eq 'golang.org/x/net[[:space:]]+v0[.]61[.]0[[:space:]]' output/caddy-build-info.txt
          grep -Eq 'golang.org/x/crypto[[:space:]]+v0[.]58[.]0[[:space:]]' output/caddy-build-info.txt
          grep -q '26.10.0' output/mysql-version.txt
      - name: Scan installed edge and database packages
        run: |
          status=0
          for target in edge database; do
            docker image save "cofounder-hetzner-$target:local" --output "output/native-$target.tar"
            chmod 0444 "output/native-$target.tar"
            docker run --rm --read-only --tmpfs /tmp:rw,size=2048m --cap-drop ALL \
              --mount "type=bind,source=$GITHUB_WORKSPACE/output/native-$target.tar,target=/scan/image.tar,readonly" \
              aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
              image --cache-dir /tmp/trivy-cache --scanners vuln --skip-java-db-update --quiet --list-all-pkgs \
              --exit-code 1 --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --format json --input /scan/image.tar > "output/image-security-$target.json" || status=1
          done
          exit "$status"
      - name: Retain runtime and native image evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-runtime-and-native-images
          path: |
            output/stable-runtime-verification.json
            output/image-security-*.json
            output/*-version.txt
            output/caddy-*.txt
            output/caddy-build-environment.json


  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_MODE: production
      PUBLIC_ORIGIN: http://localhost:3014
      JWT_SECRET: ci-container-session-secret-with-at-least-thirty-two-characters
      CREDENTIAL_ENCRYPTION_SECRET: ci-container-credential-secret-with-at-least-thirty-two-characters
      ENABLE_REGISTRATION: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
      - run: pnpm install --frozen-lockfile
      - name: Install bounded browser fixture
        run: pnpm --dir apps/cofounder-discovery exec playwright install --with-deps --only-shell chromium
      - name: Build and start the production stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Probe production liveness and database readiness
        run: node scripts/production-monitor.mjs --origin http://127.0.0.1:3014
      - name: Verify the container runtime contract
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3014/api/ready | jq --exit-status '.status == "ready"'
          curl --fail --silent --show-error http://127.0.0.1:3014/api/health | jq --exit-status '
            .status == "ok"
            and .mode == "production"
            and .databaseConfigured == true
            and .platformAutomation == "disabled"
            and .legacyRoutes == "disabled"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3014/api/integrations/hai/feed)" = "503"
      - name: Verify pruned non-root production runtime
        run: |
          mkdir -p output
          docker compose exec -T app node --input-type=module < scripts/production-smoke.mjs > output/stable-container-verification.json
      - name: Verify compiled frontend at desktop and mobile sizes
        run: node scripts/check-stable-browser.mjs
      - name: Verify installed Chromium through the application adapter
        run: |
          app_image="$(docker compose images --quiet app | head -n1)"
          test -n "$app_image"
          docker run --rm --init --interactive --read-only --network none --cap-drop ALL --security-opt no-new-privileges \
            --cpus 1 --memory 512m --memory-swap 512m --pids-limit 256 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 \
            --entrypoint node "$app_image" --input-type=module - \
            < scripts/check-installed-browser.mjs > output/installed-browser-verification.json
          test -s output/installed-browser-verification.json
          node scripts/check-installed-browser-report.mjs
      - name: Verify graceful application shutdown
        run: |
          docker compose stop app
          app_id="$(docker compose ps --all --quiet app)"
          test -n "$app_id"
          test "$(docker inspect --format '{{.State.Status}}' "$app_id")" = "exited"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$app_id")" = "0"
          case "$(docker logs "$app_id" 2>&1)" in
            *'"event":"shutdown_completed"'*) ;;
            *) echo "Missing graceful shutdown acknowledgement"; exit 1 ;;
          esac
      - name: Scan installed production app packages
        run: |
          docker image save "$(docker compose images --quiet app | head -n1)" --output output/app-image.tar
          chmod 0444 output/app-image.tar
          docker run --rm --read-only --tmpfs /tmp:rw,size=2048m --cap-drop ALL \
            --mount "type=bind,source=$GITHUB_WORKSPACE/output/app-image.tar,target=/scan/image.tar,readonly" \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --cache-dir /tmp/trivy-cache --scanners vuln --skip-java-db-update --quiet --list-all-pkgs \
            --exit-code 1 --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --format json --input /scan/image.tar > output/image-security.json
      - name: Verify complete production app inventory
        run: node scripts/check-image-security.mjs
      - name: Retain production and browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-production-and-browser
          path: |
            output/stable-container-verification.json
            output/stable-browser-verification.json
            output/installed-browser-verification.json
            output/stable-browser-*.png
            output/image-security.json

      - name: Show container diagnostics
        if: always()
        run: docker compose ps && docker compose logs --no-color --tail 200
      - name: Stop the CI stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  ubuntu-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - name: Probe candidate Ubuntu scanner and release-feed coverage
        run: |
          mkdir -p output "$RUNNER_TEMP/cofounder-grype-cache"
          docker pull ubuntu:26.10@sha256:93e29beff5257b2cdf1c024d831f6d2997e53655a653ff76a811fc9e6564a719
          docker image save ubuntu:26.10@sha256:93e29beff5257b2cdf1c024d831f6d2997e53655a653ff76a811fc9e6564a719 --output output/ubuntu-probe.tar
          chmod 0444 output/ubuntu-probe.tar
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            --cpus 1 --memory 2560m --memory-swap 2560m --pids-limit 128 --tmpfs /tmp:rw,size=128m \
            -e HOME=/tmp -e GRYPE_DB_CACHE_DIR=/cache -e GOMEMLIMIT=512MiB \
            --mount "type=bind,source=$RUNNER_TEMP/cofounder-grype-cache,target=/cache" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/output/ubuntu-probe.tar,target=/scan/image.tar,readonly" \
            anchore/grype:v0.121.0@sha256:621d56d1d68106b787022c81546f7e0a36202a25d1239f0c20195fab8c16f7ea \
            docker-archive:/scan/image.tar --output json > output/ubuntu-grype-coverage.json
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            --cpus 1 --memory 2560m --memory-swap 2560m --pids-limit 128 --tmpfs /tmp:rw,size=128m \
            -e HOME=/tmp -e GRYPE_DB_CACHE_DIR=/cache -e GOMEMLIMIT=512MiB \
            --mount "type=bind,source=$RUNNER_TEMP/cofounder-grype-cache,target=/cache" \
            anchore/grype:v0.121.0@sha256:621d56d1d68106b787022c81546f7e0a36202a25d1239f0c20195fab8c16f7ea \
            db search --distro ubuntu:26.10 --provider ubuntu --limit 10 --output json > output/ubuntu-grype-feed.json
          node scripts/check-ubuntu-coverage.mjs > output/ubuntu-coverage-verification.json
      - name: Retain candidate scanner coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ubuntu-scanner-coverage
          path: |
            output/ubuntu-grype-coverage.json
            output/ubuntu-grype-feed.json
            output/ubuntu-coverage-verification.json

  windows-source:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      NODE_ENV: test
      APP_MODE: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - run: pnpm install --frozen-lockfile
      - run: node scripts/stable-runtime.mjs
      - run: pnpm test:stable-runtime
      - run: pnpm --dir apps/cofounder-discovery check
      - run: pnpm --dir apps/cofounder-discovery test:unit
      - run: pnpm --dir apps/cofounder-discovery build
      - name: Retain Windows runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-windows-source-runtime
          path: output/stable-runtime-verification.json
