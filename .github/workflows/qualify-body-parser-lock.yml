name: Qualify normal body-parser lock update
on:
  push:
    branches: [qualify/cofounder-body-parser-lock-20261028]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - run: python .github/scripts/qualify-body-parser-lock.py prepare
      - run: node .github/scripts/verify-pnpm-policy.mjs before
      - run: python .github/scripts/qualify-body-parser-lock.py resolve
      - name: Verify unchanged strict dependency policy
        if: always()
        run: node .github/scripts/verify-pnpm-policy.mjs after
      - name: Verify original manifests and source were preserved
        if: always()
        run: python .github/scripts/qualify-body-parser-lock.py collect
      - name: Require unfiltered all-severity audit
        run: pnpm audit --audit-level low --json > artifacts/cofounder-lock/audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cofounder-body-parser-lock-${{ github.run_id }}
          path: |
            artifacts/cofounder-lock
            artifacts/pnpm-policy
          if-no-files-found: error
          retention-days: 14
